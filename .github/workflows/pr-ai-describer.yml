name: MergeMind AI Engine

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  describe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run MergeMind
        run: node src/action.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MERGEMIND_LICENSE_KEY: ${{ secrets.MERGEMIND_LICENSE_KEY }}
          # Optional: override the default validation URL if self-hosting the API
          # MERGEMIND_VALIDATION_URL: ${{ secrets.MERGEMIND_VALIDATION_URL }}
