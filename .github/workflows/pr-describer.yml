name: MergeMind AI Engine

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      license_key:
        description: "MergeMind license key to test (overrides secret)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  describe:
    runs-on: ubuntu-latest

    steps:
      # Full history so the diff range resolves (MergeMind diffs base...HEAD)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dogfood the packaged action.yml (uses: ./ references this repo's
      # action.yml at the checked-out commit).
      - uses: ./
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          license_key: ${{ github.event.inputs.license_key || secrets.MERGEMIND_LICENSE_KEY }}